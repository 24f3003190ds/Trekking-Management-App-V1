{% extends "base.html" %}
{% block title %}{% if trek %}Edit Trek{% else %}Add New Trek{% endif %}{% endblock %}
{% block content %}
<div class="container my-4">
    <div class="row">
        {% include "admin_sidebar.html" %}

        <div class="col-md-9 col-lg-10">
            <h2 class="page-heading mb-4">{% if trek %}Edit Trek{% else %}Add New Trek{% endif %}</h2>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Trek Name</label>
                        <input type="text" name="name" class="form-control"
                               value="{{ trek.name if trek else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Location</label>
                        <input type="text" name="location" class="form-control"
                               value="{{ trek.location if trek else '' }}" required>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Difficulty</label>
                        <select name="difficulty" class="form-select" required>
                            <option value="">-- Select --</option>
                            {% for level in ['Easy', 'Moderate', 'Hard'] %}
                            <option value="{{ level }}" {% if trek and trek.difficulty == level %}selected{% endif %}>{{ level }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Duration (days)</label>
                        <input type="number" name="duration" class="form-control" min="1"
                               value="{{ trek.duration if trek else '' }}" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Price</label>
                        <input type="number" name="price" class="form-control" step="0.01" min="0"
                               value="{{ trek.price if trek else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Total Slots</label>
                        <input type="number" name="total_slots" class="form-control" min="1"
                               value="{{ trek.total_slots if trek else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Available Slots</label>
                        <input type="number" name="available_slots" class="form-control" min="0"
                               value="{{ trek.available_slots if trek else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Start Date</label>
                        <input type="date" name="start_date" class="form-control"
                               value="{{ trek.start_date if trek else '' }}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">End Date</label>
                        <input type="date" name="end_date" class="form-control"
                               value="{{ trek.end_date if trek else '' }}" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select" required>
                            {% for s in ['Pending', 'Approved', 'Open', 'Closed', 'Completed'] %}
                            <option value="{{ s }}" {% if trek and trek.status == s %}selected{% endif %}>{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Assign Staff</label>
                        <select name="assigned_staff_id" class="form-select">
                            <option value="">-- Unassigned --</option>
                            {% for staff in approved_staff %}
                            <option value="{{ staff.id }}"
                                {% if trek and trek.assigned_staff_id == staff.id %}selected{% endif %}>
                                {{ staff.user.username }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3" required>{{ trek.description if trek else '' }}</textarea>
                    </div>
                </div>

                <div class="mt-4" >
                    <button type="submit" class="btn btn-primary">Save</button> 
                    <a href="{{ url_for('admin_treks') }}" class="btn btn-outline-primary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
