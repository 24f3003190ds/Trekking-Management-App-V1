{% extends "base.html" %}
{% block title %}Update Trek - Ru'ya Horizons{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        {% include "staff_sidebar.html" %}

        <div class="col-md-9 col-lg-10">
            <h2 class="page-heading">Update: {{ trek.name }}</h2>

            <form method="POST" class="mt-3" style="max-width: 400px;">
                <div class="mb-3">
                    <label class="form-label">Available Slots</label>
                    <input type="number" name="available_slots" class="form-control"
                           value="{{ trek.available_slots }}" min="0" max="{{ trek.total_slots }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        <option value="Open" {% if trek.status == 'Open' %}selected{% endif %}>Open</option>
                        <option value="Closed" {% if trek.status == 'Closed' %}selected{% endif %}>Closed</option>
                        <option value="Completed" {% if trek.status == 'Completed' %}selected{% endif %}>Completed</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('staff_dashboard') }}" class="btn btn-outline-primary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
