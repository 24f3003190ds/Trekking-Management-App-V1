{% extends "base.html" %}

{% block title %}Register Form{% endblock %}

{% block content %}
<div class="container auth-container">
    <h2 class="page-heading text-center mb-4">Create an Account</h2>

    {% if error %}
        <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('register') }}">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" value="{{ username or '' }}" required>
        </div>
 
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ email or '' }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" class="form-control" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Register As</label>
            <select name="role" class="form-select" required>
                <option value="trekker">Trekker</option>
                <option value="trek_staff">Trek Staff</option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Register</button>
    </form>

    <p class="text-center mt-3">
        Already have an account? <a href="{{ url_for('login') }}">Login here</a>
    </p>
</div>
{% endblock %}
