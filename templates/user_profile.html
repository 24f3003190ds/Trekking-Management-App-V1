{% extends "base.html" %}
{% block title %}Profile - Ru'ya Horizons{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row">
        {% include "user_sidebar.html" %}

        <div class="col-md-9 col-lg-10">
            <h2 class="page-heading">My Profile</h2>

            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}

            <form method="POST" class="mt-3" style="max-width: 400px;">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" value="{{ current_user.username }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ current_user.email }}" required>
                </div>

                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
