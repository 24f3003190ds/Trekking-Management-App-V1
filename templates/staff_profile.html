{% extends "base.html" %}
{% block title %}Profile - Ru'ya Horizons{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row">
        {% include "staff_sidebar.html" %}

        <div class="col-md-9 col-lg-10">
            <h2 class="page-heading">My Profile</h2>

            <form method="POST" class="my-3" style="max-width: 400px;">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" value="{{ staff_profile.user.username }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" class="form-control" value="{{ staff_profile.user.email }}" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Contact Number</label>
                    <input type="text" name="contact" class="form-control" value="{{ staff_profile.contact or '' }}">
                </div>

                <div class="mb-4">
                    <label class="form-label">Approval Status</label>
                    <input type="text" class="form-control" value="Approved" disabled>
                </div>

                <button type="submit" class="btn btn-primary">Save Contact</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
